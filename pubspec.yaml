name: portable_goldens
description: "A golden file comparator that compares each golden exactly against a baseline this machine rendered, built from the commit that last changed it."
version: 0.1.0
repository: https://github.com/SupposedlySam/portable_goldens
topics:
  - golden
  - testing

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  # The comparator is a GoldenFileComparator, which flutter_test defines.
  flutter_test:
    sdk: flutter
  # Reads `portable_goldens: setup:` from the consumer's pubspec. It is the
  # Dart team's, and its own dependencies (collection, source_span,
  # string_scanner) are already resolved for flutter and flutter_test, so it
  # adds one package; a reader of our own would misread flow lists, quoting
  # and comments.
  yaml: ^3.1.3

dev_dependencies:
  very_good_analysis: ^11.0.0

executables:
  prepare:
  prune:
  report:
  verify:
