# Checks the package on Linux, macOS and Windows. It never publishes: a
# release to pub.dev is made by hand.
#
# What it checks: formatting, analysis with infos as errors, no null
# assertions in lib/ and bin/, no source file hidden from git or pub, the
# whole test suite, the publish dry run, and the README's workflow run for
# real in a new consumer repository (tool/consumer_workflow.sh), once with
# plain pngs and once with the pngs in Git LFS. Each runner image has Git
# LFS; where one does not, that step fails rather than skips.
#
# What it does not check: Flutter releases other than the one in .fvmrc,
# that two different machines agree (each job is one machine), and an LFS
# object that has to be downloaded from a server.
name: ci

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        # The guards and the consumer workflow are bash; Git for Windows has
        # it, and elsewhere it is the default anyway.
        shell: bash
    steps:
      # Baselines are built from commits, so the tests need the whole history.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: kuhnroyal/flutter-fvm-config-action/setup@v3
        with:
          path: .fvmrc

      - name: Resolve
        run: flutter pub get

      - name: Format
        run: dart format --output=none --set-exit-if-changed lib bin test example tool

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: No null assertions in library code
        run: tool/check_null_assertions.sh

      - name: No source hidden from git or pub
        run: tool/check_ignored_sources.sh

      - name: Test
        run: flutter test

      - name: The README's workflow, in a new consumer repository
        run: tool/consumer_workflow.sh

      - name: The same, with the pngs in Git LFS
        run: tool/consumer_workflow.sh --lfs

      - name: Publish dry run
        run: flutter pub publish --dry-run
